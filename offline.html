<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061018">
  <title>LinuxAid | Offline</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="product.css">
</head>
<body>
  <main class="offline-shell" id="main-content">
    <section class="offline-card">
      <div class="offline-icon"><i class="fas fa-wifi"></i></div>
      <div class="eyebrow">Offline workspace</div>
      <h1>You are offline, but LinuxAid is still useful.</h1>
      <p style="color:var(--muted);line-height:1.8">Previously cached courses, tools and simulator files can continue to work. Remote AI, Firebase sync and community updates will reconnect automatically when your connection returns.</p>
      <div class="product-hero-actions" style="justify-content:center">
        <a class="button primary" href="dashboard.html">Open cached dashboard</a>
        <button class="button" type="button" onclick="location.reload()">Try again</button>
      </div>
    </section>
  </main>
</body>
</html>
